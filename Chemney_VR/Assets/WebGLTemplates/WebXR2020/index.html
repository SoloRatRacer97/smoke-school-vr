<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | {{{ PRODUCT_NAME }}}</title>
    <meta name="description" content="{{{ DESCRIPTION }}}">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="auth-config.js"></script>
    <style>
      #unity-canvas-container { position: relative; }
      #unity-login-overlay { display: none; position: absolute; inset: 0; z-index: 4; pointer-events: none; }
      #unity-login-overlay input,
      #unity-login-overlay button { position: absolute; box-sizing: border-box; pointer-events: auto; }
      #unity-coming-soon-banner { position: absolute; left: 25%; top: 48%; width: 50%; height: 27.2%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; box-sizing: border-box; padding: 24px 48px; border-radius: 10px; background: rgba(244, 185, 66, .7); color: #292329; text-align: center; pointer-events: none; }
      #unity-coming-soon-banner h2 { margin: 0; font: 700 34px Arial, sans-serif; letter-spacing: .01em; }
      #unity-coming-soon-banner p { margin: 0; max-width: 560px; font: 500 19px/1.35 Arial, sans-serif; }
      #unity-login-overlay input { left: 31.67%; width: 36.56%; border: 0; padding: 0 18px; background: rgba(255, 255, 255, .96); color: #292329; font: 18px Arial, sans-serif; text-align: center; outline: 0; }
      #unity-login-overlay input:focus { box-shadow: inset 0 0 0 3px rgba(32, 102, 72, .65); }
      #unity-login-password { top: 0; height: 8.2%; }
      #unity-login-email { top: 18.5%; height: 8.7%; }
      #unity-login-submit { left: 40%; top: 35.3%; width: 20%; height: 9.5%; border: 0; background: transparent; color: transparent; cursor: pointer; }
      #unity-login-spinner { position: absolute; top: 2.15%; right: 32.8%; width: 20px; height: 20px; box-sizing: border-box; border: 3px solid rgba(32, 102, 72, .22); border-top-color: #206648; border-radius: 50%; animation: unity-login-spin .7s linear infinite; pointer-events: none; }
      @keyframes unity-login-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <div id="unity-canvas-container">
        <canvas id="unity-canvas" style="width: 100%; height: 100%;"></canvas>
        <form id="unity-login-overlay" autocomplete="on">
          <input id="unity-login-password" type="password" autocomplete="current-password" aria-label="Password" placeholder="Password" required>
          <span id="unity-login-spinner" role="status" aria-label="Signing in" hidden></span>
          <div id="unity-coming-soon-banner">
            <h2>Coming Soon</h2>
            <p>Our VR testing environment will be live soon. Return back here shortly.</p>
          </div>
          <input id="unity-login-email" type="email" autocomplete="username" aria-label="User Email" placeholder="Email" required>
          <button id="unity-login-submit" type="submit" aria-label="Submit login">Submit</button>
        </form>
      </div>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <button id="entervr" value="Enter VR" disabled>VR</button>
        <button id="enterar" value="Enter AR" disabled>AR</button>
        <div id="unity-webxr-link">Using <a href="https://github.com/De-Panther/unity-webxr-export" target="_blank" title="WebXR Export">WebXR Export</a></div>
        <div id="unity-build-title">{{{ PRODUCT_NAME }}}</div>
      </div>
    </div>
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var canvasContainer = document.querySelector("#unity-canvas-container");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var unityInstance = null;
      {{{ WEBXR_POLYFILL_CONFIG }}}

      canvasContainer.style.width = "{{{ WIDTH }}}px";
      canvasContainer.style.height = "{{{ HEIGHT }}}px";
#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((instance) => {
          unityInstance = instance;
          loadingBar.style.display = "none";
          document.getElementById("unity-login-overlay").style.display = "block";
          if (fullscreenButton)
          {
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);

      document.getElementById("unity-login-overlay").addEventListener("submit", function (event) {
        event.preventDefault();
        if (!unityInstance) return;
        var passwordInput = document.getElementById("unity-login-password");
        var emailInput = document.getElementById("unity-login-email");
        unityInstance.SendMessage("LoginPanel", "ReceiveBrowserLogin", JSON.stringify({
          email: emailInput.value.trim(),
          password: passwordInput.value
        }));
        passwordInput.value = "";
      });

      let enterARButton = document.getElementById('enterar');
      let enterVRButton = document.getElementById('entervr');

      document.addEventListener('onARSupportedCheck', function (event) {
        enterARButton.disabled = !event.detail.supported;
      }, false);
      document.addEventListener('onVRSupportedCheck', function (event) {
        enterVRButton.disabled = !event.detail.supported;
      }, false);

      enterARButton.addEventListener('click', function (event) {
        unityInstance.Module.WebXR.toggleAR();
      }, false);
      enterVRButton.addEventListener('click', function (event) {
        unityInstance.Module.WebXR.toggleVR();
      }, false);
    </script>
  </body>
</html>
