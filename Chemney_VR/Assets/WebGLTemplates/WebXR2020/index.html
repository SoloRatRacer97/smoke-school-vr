<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | {{{ PRODUCT_NAME }}}</title>
    <meta name="description" content="{{{ DESCRIPTION }}}">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="auth-config.js"></script>
    <style>
      :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
      body { margin: 0; background: #160509; }
      #unity-container { display: none; }
      #auth-gate { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 70% 15%, #7d1021, transparent 420px), linear-gradient(145deg, #5d0916, #190509 76%); }
      .auth-card { width: min(100%, 440px); border: 1px solid rgba(255,255,255,.15); border-radius: 14px; padding: 34px; background: rgba(255,255,255,.97); color: #201417; box-shadow: 0 28px 80px rgba(0,0,0,.35); }
      .auth-brand { margin: 0 0 8px; color: #700718; font-family: Georgia, serif; font-size: 30px; text-transform: uppercase; }
      .auth-card h1 { margin: 24px 0 8px; color: #3b0a12; font-family: Georgia, serif; font-size: 28px; }
      .auth-card p { margin: 0 0 22px; color: #6f6064; line-height: 1.45; }
      .auth-card label { display: grid; gap: 8px; margin-top: 16px; font-size: 13px; font-weight: 700; }
      .auth-card input { min-height: 46px; border: 1px solid #d9ced0; border-radius: 7px; padding: 0 13px; background: #fff; color: #201417; font: inherit; }
      .auth-card button { width: 100%; min-height: 48px; margin-top: 22px; border: 0; border-radius: 7px; background: #790819; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
      .auth-card button:disabled { cursor: wait; opacity: .65; }
      #auth-status { min-height: 20px; margin: 15px 0 0; color: #a00518; font-size: 13px; font-weight: 700; }
      #auth-status.success { color: #1b6a35; }
    </style>
  </head>
  <body>
    <main id="auth-gate">
      <form class="auth-card" id="auth-form">
        <div class="auth-brand">Smoke School</div>
        <p>VR training access</p>
        <h1>Sign in to begin.</h1>
        <label>Email<input id="auth-email" name="email" type="email" autocomplete="username" required></label>
        <label>Password<input id="auth-password" name="password" type="password" autocomplete="current-password" required></label>
        <button id="auth-submit" type="submit">Sign In</button>
        <p id="auth-status" role="alert" aria-live="polite"></p>
      </form>
    </main>
    <div id="unity-container">
      <div id="unity-canvas-container">
        <canvas id="unity-canvas" style="width: 100%; height: 100%;"></canvas>
      </div>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <button id="entervr" value="Enter VR" disabled>VR</button>
        <button id="enterar" value="Enter AR" disabled>AR</button>
        <div id="unity-webxr-link">Using <a href="https://github.com/De-Panther/unity-webxr-export" target="_blank" title="WebXR Export">WebXR Export</a></div>
        <div id="unity-build-title">{{{ PRODUCT_NAME }}}</div>
      </div>
    </div>
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var canvasContainer = document.querySelector("#unity-canvas-container");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var unityInstance = null;
      var approvedProfile = null;
      {{{ WEBXR_POLYFILL_CONFIG }}}

      canvasContainer.style.width = "{{{ WIDTH }}}px";
      canvasContainer.style.height = "{{{ HEIGHT }}}px";
#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif
      function configuredAuthApi() {
        const queryOverride = new URLSearchParams(window.location.search).get("authApi");
        return queryOverride || window.SMOKE_SCHOOL_AUTH?.apiUrl || "";
      }

      function showAuthStatus(message, success) {
        const status = document.getElementById("auth-status");
        status.textContent = message;
        status.classList.toggle("success", Boolean(success));
      }

      function startUnity(profile) {
        approvedProfile = profile;
        document.getElementById("unity-container").style.display = "block";
        loadingBar.style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = 100 * progress + "%";
          }).then((instance) => {
            unityInstance = instance;
            unityInstance.SendMessage("LoginPanel", "CompleteApprovedLogin", JSON.stringify(approvedProfile));
            loadingBar.style.display = "none";
            document.getElementById("auth-gate").style.display = "none";
            approvedProfile = null;
            if (fullscreenButton)
            {
              fullscreenButton.onclick = () => {
                unityInstance.SetFullscreen(1);
              };
            }
          }).catch((message) => {
            document.getElementById("unity-container").style.display = "none";
            document.getElementById("auth-gate").style.display = "grid";
            showAuthStatus("The VR application could not be loaded. Please try again.", false);
          });
        };
        script.onerror = () => {
          document.getElementById("unity-container").style.display = "none";
          document.getElementById("auth-gate").style.display = "grid";
          showAuthStatus("The VR application loader is unavailable.", false);
        };
        document.body.appendChild(script);
      }

      document.getElementById("auth-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const submit = document.getElementById("auth-submit");
        const emailInput = document.getElementById("auth-email");
        const passwordInput = document.getElementById("auth-password");
        const apiUrl = configuredAuthApi();

        if (!apiUrl) {
          showAuthStatus("Authentication service is not configured.", false);
          return;
        }

        submit.disabled = true;
        showAuthStatus("Checking access...", true);
        try {
          const response = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: emailInput.value.trim(), password: passwordInput.value })
          });
          const result = await response.json().catch(() => null);
          passwordInput.value = "";

          if (response.ok && result?.approved && result.student) {
            showAuthStatus("Access approved. Loading VR training...", true);
            startUnity(result.student);
            return;
          }

          if (response.status === 429) {
            const retryAfter = Number(response.headers.get("Retry-After") || 900);
            showAuthStatus("Too many attempts. Try again in " + Math.ceil(retryAfter / 60) + " minutes.", false);
          } else if (result?.reason === "access_expired") {
            showAuthStatus("This training access has expired.", false);
          } else if (result?.reason === "access_inactive") {
            showAuthStatus("This training access is inactive.", false);
          } else if (response.status === 401) {
            showAuthStatus("The email or password is incorrect.", false);
          } else {
            showAuthStatus("Authentication is temporarily unavailable.", false);
          }
        } catch (error) {
          passwordInput.value = "";
          showAuthStatus("Could not reach the authentication service.", false);
        } finally {
          submit.disabled = false;
        }
      });

      let enterARButton = document.getElementById('enterar');
      let enterVRButton = document.getElementById('entervr');

      document.addEventListener('onARSupportedCheck', function (event) {
        enterARButton.disabled = !event.detail.supported;
      }, false);
      document.addEventListener('onVRSupportedCheck', function (event) {
        enterVRButton.disabled = !event.detail.supported;
      }, false);

      enterARButton.addEventListener('click', function (event) {
        unityInstance.Module.WebXR.toggleAR();
      }, false);
      enterVRButton.addEventListener('click', function (event) {
        unityInstance.Module.WebXR.toggleVR();
      }, false);
    </script>
  </body>
</html>
