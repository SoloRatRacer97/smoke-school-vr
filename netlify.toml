[build]
  publish = "Chemney_VR/VR Smoke School"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from = "/api/auth/me"
  to = "/.netlify/functions/auth-me"
  status = 200

[[redirects]]
  from = "/api/auth/logout"
  to = "/.netlify/functions/auth-logout"
  status = 200

[[headers]]
  for = "/Build/VR Smoke School.wasm.br"
  [headers.values]
    "Content-Type" = "application/wasm"
    "Content-Encoding" = "br"

[[headers]]
  for = "/Build/VR Smoke School.framework.js.br"
  [headers.values]
    "Content-Type" = "application/javascript"
    "Content-Encoding" = "br"

[[headers]]
  for = "/Build/VR Smoke School.data.br"
  [headers.values]
    "Content-Type" = "application/octet-stream"
    "Content-Encoding" = "br"

[[headers]]
  for = "/Build/*.wasm.br"
  [headers.values]
    "Content-Type" = "application/wasm"
    "Content-Encoding" = "br"

[[headers]]
  for = "/Build/*.js.br"
  [headers.values]
    "Content-Type" = "application/javascript"
    "Content-Encoding" = "br"

[[headers]]
  for = "/Build/*.data.br"
  [headers.values]
    "Content-Type" = "application/octet-stream"
    "Content-Encoding" = "br"
